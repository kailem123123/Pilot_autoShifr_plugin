Интерфейс IDocumentsExplorerDetailsViewProvider
Интерфейс позволяет заменить карточку элемента в Обозревателе элементов на свою собственную. Для этого необходимо реализовать интерфейс из пакета Ascon.Pilot.SDK IDocumentsExplorerDetailsViewProvider и обязательно пометить класс, реализующий интерфейс IDocumentsExplorerDetailsViewProvider атрибутом [Export]

using System.ComponentModel.Composition;
