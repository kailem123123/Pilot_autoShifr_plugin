Интерфейс IClearCache
Интерфейс позволяет добавить новую опцию очистки кеша в диалог Управление кешем. Для этого необходимо реализовать интерфейс из пакета Ascon.Pilot.SDK IClearCache и обязательно пометить класс, реализующий интерфейс IClearCache атрибутом [Export]

