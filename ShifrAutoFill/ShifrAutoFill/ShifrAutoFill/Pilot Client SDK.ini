        {
            outputFiles = new List<string>();

            if (!File.Exists(inputFile))
                return false;

            if (!string.Equals(Path.GetExtension(inputFile), ".pdf", StringComparison.OrdinalIgnoreCase))
                return false;
            //some logic for pdf format as example
            return true;
        }
    }
}

