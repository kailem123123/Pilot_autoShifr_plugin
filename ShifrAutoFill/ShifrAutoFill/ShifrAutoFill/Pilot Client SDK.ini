using Ascon.Pilot.SDK;

namespace ClearCacheSample
{
    [Export(typeof(IClearCache))]
    public class ClearCacheProcedure : IClearCache
    {
        ...
    }
}

Свойства
string Title { get; }

Свойство должно возвращать название процедуры очистки кеша для модуля расширения, которое будет отображаться в диалоге Управление кешем.

Методы
void GetInfo(ClearCacheInfo clearCacheInfo);

Метод должен давать информацию о количестве и общем размере файлов кеша, которые могут быть удалены в данный момент. Для этого в данном методе должны задаваться соответсвующие значения свойств объекта класса ClearCacheInfo, передаваемого как аргумент метода.

void ExecuteClearCache();

Метод должен выполнять процедуру очистки кеша для модуля расширения. Следует учитывать возможность отмены этой процедуры с помощью метода StopClearCache. Данный метод работает на специальном рабочем потоке (worker thread) и не блокирует GUI.

void StopClearCache();

Метод должен отменять выполнение метода ExecuteClearCache. Данный метод работает на UI потоке (UI thread).

События
event EventHandler<ClearCacheProgressChangedEventArgs> ClearCacheProgressChanged;


